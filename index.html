<!doctype html>
<html lang="fr" class="theme-day">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tic-Tac - Apprendre à lire l'heure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#38bdf8">
  </head>
  <body class="theme-day">
    <div id="sky-backdrop" aria-hidden="true">
      <div class="sun-orb"></div>
      <div class="cloud cloud-1"></div>
      <div class="moon-orb"></div>
      <div class="stars-layer"></div>
    </div>

    <div id="app">
      <!-- VUE 1 : MENU PRINCIPAL -->
      <div id="main-menu" class="view">
        <div id="global-top-bar">
          <div class="top-left-actions">
            <button id="profile-btn" type="button" aria-label="Joueurs et profils" title="Changer de joueur">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            </button>
            <button id="force-refresh-btn" type="button" title="Vider le cache PWA et forcer la mise à jour">⚡ Maj v52</button>
          </div>
          <button id="sound-toggle-btn" type="button" aria-pressed="true" aria-label="Activer ou couper le son" title="Son actif">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" fill-opacity="0.2"></polygon>
              <path class="sound-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path class="sound-wave" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              <line class="mute-slash" x1="3" y1="3" x2="21" y2="21"></line>
            </svg>
          </button>
        </div>

        <div id="main-title-box">
          <h1>Tic-Tac</h1>
          <p>Apprends à lire l'heure pas à pas !</p>
          <div id="player-progress-bar">
            <span id="player-rank-title">⏱️ Apprenti du Temps</span>
            <span id="player-stars-count">★ 0 / 24</span>
          </div>
        </div>

        <div id="levels-grid">
          <button class="level-rect lvl-1" data-level="1">
            <span class="lvl-badge">1</span>
            <div class="lvl-content"><span class="lvl-title">Les Heures (12h)</span></div>
            <span class="lvl-status play">▶</span>
          </button>

          <button class="level-rect lvl-2 locked" data-level="2">
            <span class="lvl-badge">2</span>
            <div class="lvl-content"><span class="lvl-title">Les 24 Heures</span></div>
            <span class="lvl-status locked-icon">🔒</span>
          </button>

          <button class="level-rect lvl-3 locked" data-level="3">
            <span class="lvl-badge">3</span>
            <div class="lvl-content"><span class="lvl-title">Les Minutes</span></div>
            <span class="lvl-status locked-icon">🔒</span>
          </button>

          <button class="level-rect lvl-4 locked" data-level="4">
            <span class="lvl-badge">4</span>
            <div class="lvl-content"><span class="lvl-title">Les Demi-Heures</span></div>
            <span class="lvl-status locked-icon">🔒</span>
          </button>

          <button class="level-rect lvl-5 locked" data-level="5">
            <span class="lvl-badge">5</span>
            <div class="lvl-content"><span class="lvl-title">Les Quarts d'Heure</span></div>
            <span class="lvl-status locked-icon">🔒</span>
          </button>

          <button class="level-rect lvl-6 locked" data-level="6">
            <span class="lvl-badge">6</span>
            <div class="lvl-content"><span class="lvl-title">À la Minute près</span></div>
            <span class="lvl-status locked-icon">🔒</span>
          </button>

          <button class="level-rect lvl-7 locked" data-level="7">
            <span class="lvl-badge">7</span>
            <div class="lvl-content"><span class="lvl-title">Le Défi Jour &amp; Nuit</span></div>
            <span class="lvl-status locked-icon">🔒</span>
          </button>

          <button class="level-rect lvl-8 locked" data-level="8">
            <span class="lvl-badge">8</span>
            <div class="lvl-content"><span class="lvl-title">L'Horloge des Grands</span></div>
            <span class="lvl-status locked-icon">🔒</span>
          </button>

          <button id="workshop-btn" type="button" class="workshop-rect locked">
            <span class="lvl-badge workshop-badge">⚙️</span>
            <div class="lvl-content"><span class="lvl-title">L'Atelier de l'Horloger</span></div>
            <span id="workshop-status" class="lvl-status locked-icon">🔒</span>
          </button>
        </div>
      </div>

      <!-- VUE 2 : ÉCRAN DE JEU -->
      <div id="game-screen" class="view hidden">
        <div id="game-top-bar">
          <button id="back-menu-btn" type="button" class="top-square-btn" aria-label="Retour au menu" title="Retour au menu">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 12H5"></path>
              <path d="M12 19l-7-7 7-7"></path>
            </svg>
          </button>
          <div id="level-header-pill" class="lvl-1">
            <span id="level-title-display">Niveau 1</span>
            <span id="phase-badge" class="stars-group"></span>
          </div>
          <button id="tutorial-btn" type="button" class="top-square-btn" title="Revoir l'explication du niveau">💡</button>
        </div>

        <div id="period-row">
          <span id="period-chip-el" class="period-chip invisible-chip">☀️ Matin</span>
        </div>

        <div id="game-container">
          <canvas id="clockCanvas" width="500" height="500"></canvas>
        </div>

        <div id="ui-container">
          <div id="message-stage">
            <div id="tutorial-callout-row" class="hidden">
              <span id="tutorial-callout-pill">3 heures</span>
            </div>
            <div id="instruction">Quelle heure est-il ?</div>
            <div id="help-box" class="invisible-feedback">
              <span id="help-text"></span>
            </div>
          </div>
          <div id="controls-zone">
            <div id="choices-container">
              <button class="choice-btn" type="button" data-index="0">--</button>
              <button class="choice-btn" type="button" data-index="1">--</button>
              <button class="choice-btn" type="button" data-index="2">--</button>
            </div>
            <div id="placement-tools" class="hidden">
              <button id="check-btn" type="button">✓ Vérifier</button>
            </div>
            <div id="tutorial-tools" class="hidden">
              <button id="tutorial-start-btn" type="button">C'est parti ! ▶</button>
            </div>
          </div>
        </div>
      </div>

      <!-- VUE 3 : L'ATELIER DE L'HORLOGER -->
      <div id="workshop-screen" class="view hidden">
        <div id="workshop-top-bar">
          <button id="workshop-back-btn" type="button" class="top-square-btn" aria-label="Retour au menu" title="Retour au menu">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 12H5"></path>
              <path d="M12 19l-7-7 7-7"></path>
            </svg>
          </button>
          <div id="workshop-header-pill" class="workshop-rect">
            <span>⚙️ L'Atelier de l'Horloger</span>
          </div>
        </div>
        <div id="workshop-canvas-wrap">
          <canvas id="workshopCanvas" width="500" height="500"></canvas>
        </div>
        <div id="workshop-ui">
          <div id="workshop-parts-tray"></div>
        </div>
      </div>

      <!-- MODALE JOUEURS DESIGN SOIGNÉ -->
      <div id="profile-modal" class="modal hidden">
        <div class="modal-content profile-modal-content">
          <div class="modal-header-row">
            <div class="modal-title-group">
              <div class="modal-title-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
              </div>
              <div>
                <h2>Qui joue ?</h2>
                <p class="profile-subtitle">Choisis ton profil ou ajoute un joueur</p>
              </div>
            </div>
            <button id="profile-close-top-btn" type="button" class="modal-icon-close" aria-label="Fermer">✕</button>
          </div>

          <div id="profiles-list"></div>

          <form id="add-profile-form">
            <input id="new-profile-input" type="text" maxlength="16" placeholder="Ajouter un joueur..." autocomplete="off" />
            <button type="submit" id="add-profile-submit" aria-label="Ajouter ce joueur" title="Ajouter ce joueur">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </form>
        </div>
      </div>

      <!-- POPUP PWA -->
      <div id="pwa-install-modal" class="modal hidden">
        <div class="modal-content install-modal-content">
          <div class="install-icon"><img src="./favicon.svg" alt="Tic-Tac" class="install-app-icon" /></div>
          <h2>Installe Tic-Tac !</h2>
          <p id="install-text">Installe l'application sur ton écran pour y jouer sans internet !</p>
          <div class="install-actions">
            <button id="pwa-install-btn">Installer</button>
            <button id="pwa-close-btn">Plus tard</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

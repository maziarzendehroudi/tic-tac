<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tic-Tac - Apprendre à lire l'heure</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#38bdf8">
    <script type="module" crossorigin src="/tic-tac/assets/index-bHxp7Lgd.js"></script>
    <link rel="stylesheet" crossorigin href="/tic-tac/assets/index-DsGHOS_g.css">
  </head>
  <body class="theme-day">
    <!-- FOND DE CIEL PLEIN ÉCRAN (JOUR : CIEL BLEU CLAIR & NUAGES / NUIT : CIEL ÉTOILÉ) -->
    <div id="sky-backdrop" aria-hidden="true">
      <div class="sun-orb"></div>
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="moon-orb"></div>
      <div class="stars-layer"></div>
    </div>

    <div id="app">
      <!-- BARRE AUDIO & TEST PROVISOIRE -->
      <div id="global-top-bar">
        <button id="dev-unlock-btn" type="button" title="Bouton provisoire de test">🔓 Tout débloquer (Test)</button>
        <button id="sound-toggle-btn" type="button" aria-pressed="true">🔊 Son actif</button>
      </div>

      <!-- VUE 1 : MENU PRINCIPAL -->
      <div id="main-menu" class="view">
        <div id="main-title-box">
          <h1>⏱️ Tic-Tac</h1>
          <p>Apprends à lire l'heure pas à pas !</p>
        </div>

        <div id="levels-grid">
          <button class="level-rect lvl-1" data-level="1">
            <div class="lvl-content">
              <span class="lvl-title">🥉 Niveau 1 ➔ Les Heures Piles</span>
              <span class="lvl-desc">Lire l'heure juste (ex : 3h00, 8h00)</span>
            </div>
            <span class="lvl-check hidden">✅</span>
          </button>
          <button class="level-rect lvl-2 locked" data-level="2">
            <div class="lvl-content">
              <span class="lvl-title">🥈 Niveau 2 ➔ Les Demi-Heures</span>
              <span class="lvl-desc">Repères :00 (en haut) et :30 « et demie » (en bas)</span>
            </div>
            <span class="lvl-check hidden">✅</span>
          </button>
          <button class="level-rect lvl-3 locked" data-level="3">
            <div class="lvl-content">
              <span class="lvl-title">🥇 Niveau 3 ➔ Les Quarts d'Heure</span>
              <span class="lvl-desc">Repères :15 « et quart » et :45 « moins le quart »</span>
            </div>
            <span class="lvl-check hidden">✅</span>
          </button>
          <button class="level-rect lvl-4 locked" data-level="4">
            <div class="lvl-content">
              <span class="lvl-title">🏅 Niveau 4 ➔ Les Minutes de 5 en 5</span>
              <span class="lvl-desc">La couronne bleue des minutes (05, 10, 20, 25...)</span>
            </div>
            <span class="lvl-check hidden">✅</span>
          </button>
          <button class="level-rect lvl-5 locked" data-level="5">
            <div class="lvl-content">
              <span class="lvl-title">🌟 Niveau 5 ➔ Les 24 Heures (Jour & Nuit)</span>
              <span class="lvl-desc">Matin (08h), Après-midi (15h), Soir (20h) et Minuit (00h)</span>
            </div>
            <span class="lvl-check hidden">✅</span>
          </button>
          <button class="level-rect lvl-6 locked" data-level="6">
            <div class="lvl-content">
              <span class="lvl-title">👑 Niveau 6 ➔ Maître du Temps</span>
              <span class="lvl-desc">Lire et placer les aiguilles à la minute près !</span>
            </div>
            <span class="lvl-check hidden">✅</span>
          </button>
        </div>
      </div>

      <!-- VUE 2 : ÉCRAN DE JEU ÉPURÉ -->
      <div id="game-screen" class="view hidden">
        <div id="game-top-bar">
          <button id="back-menu-btn" title="Retour au menu">
            🏠 <span id="level-title-display">Niveau 1</span>
          </button>
          <div id="phase-badge">Étape 1/2 : Lecture (0/3)</div>
        </div>

        <div id="game-container">
          <canvas id="clockCanvas" width="500" height="500"></canvas>
        </div>

        <div id="ui-container">
          <div id="instruction">Quelle heure est-il ?</div>

          <div id="help-box" class="hidden">
            💡 <span id="help-text">Regarde bien les aiguilles !</span>
          </div>

          <div id="placement-tools" class="hidden">
            <div class="hand-selector-group">
              <button id="select-hour-btn" type="button" class="hand-select-btn active-hand-btn">
                🟡 Heures
              </button>
              <button id="select-minute-btn" type="button" class="hand-select-btn">
                🔵 Minutes
              </button>
            </div>
            <div class="step-nudge-group">
              <button id="step-minus-btn" type="button" class="nudge-btn" title="Reculer l'aiguille">➖</button>
              <button id="step-plus-btn" type="button" class="nudge-btn" title="Avancer l'aiguille">➕</button>
            </div>
          </div>

          <div id="choices-container">
            <button class="choice-btn" data-index="0">--</button>
            <button class="choice-btn" data-index="1">--</button>
            <button class="choice-btn" data-index="2">--</button>
          </div>
          <button id="check-btn" class="hidden">✅ Vérifier</button>
        </div>
      </div>

      <!-- POPUP PWA -->
      <div id="pwa-install-modal" class="modal hidden">
        <div class="modal-content install-modal-content">
          <div class="install-icon">⏰</div>
          <h2>Installe Tic-Tac !</h2>
          <p id="install-text">Installe l'application sur ton écran pour y jouer sans internet !</p>
          <div class="install-actions">
            <button id="pwa-install-btn" style="padding: 12px 20px;">Installer</button>
            <button id="pwa-close-btn" style="background-color: #cbd5e1; color: #334155;">Plus tard</button>
          </div>
        </div>
      </div>
    </div>

  </body>
</html>

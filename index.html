<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tic-Tac - Apprenez à lire l'heure</title>
    
    <!-- Police ludique Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Configuration PWA & Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <!-- Optimisations Apple iOS / iPadOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tic-Tac">
    <link rel="apple-touch-icon" href="./icon-192.png">
  </head>
  <body>
    <div id="app">
      <!-- VUE 1 : MENU PRINCIPAL ÉPURÉ -->
      <div id="main-menu" class="view">
        <div id="main-score-container">
          <span id="big-score-num">0</span> ⚙️
        </div>
        
        <div class="menu-intro">
          <h2>Choisis ton niveau ⏰</h2>
        </div>

        <div id="levels-grid">
          <button class="level-rect lvl-1" data-level="1">
            <div class="lvl-content">
              <span class="lvl-title">Niveau 1</span>
              <span class="lvl-desc">Les heures pleines</span>
            </div>
            <span class="lvl-check hidden">✅</span>
          </button>

          <button class="level-rect lvl-2 locked" data-level="2">
            <div class="lvl-content">
              <span class="lvl-title">Niveau 2</span>
              <span class="lvl-desc">Les demi-heures</span>
            </div>
            <span class="lvl-check hidden">✅</span>
          </button>

          <button class="level-rect lvl-3 locked" data-level="3">
            <div class="lvl-content">
              <span class="lvl-title">Niveau 3</span>
              <span class="lvl-desc">Les quarts d'heure</span>
            </div>
            <span class="lvl-check hidden">✅</span>
          </button>

          <button class="level-rect lvl-4 locked" data-level="4">
            <div class="lvl-content">
              <span class="lvl-title">Niveau 4</span>
              <span class="lvl-desc">Précision 5 minutes</span>
            </div>
            <span class="lvl-check hidden">✅</span>
          </button>

          <button class="level-rect lvl-5 locked" data-level="5">
            <div class="lvl-content">
              <span class="lvl-title">Niveau 5</span>
              <span class="lvl-desc">Les 24 heures</span>
            </div>
            <span class="lvl-check hidden">✅</span>
          </button>
        </div>

        <button id="shop-btn-main">🛒 Boutique magique</button>
      </div>

      <!-- VUE 2 : ÉCRAN DE JEU ÉPURÉ -->
      <div id="game-screen" class="view hidden">
        <div id="game-top-bar">
          <button id="back-menu-btn" title="Retour au menu">
            <span id="level-title-display">Niveau 1</span> 🏠
          </button>
          <div id="game-score-display">0 ⚙️</div>
        </div>
        
        <div id="phase-badge">Étape 1/2 : Lecture</div>

        <div id="game-container">
          <canvas id="clockCanvas" width="500" height="500"></canvas>
        </div>

        <div id="ui-container">
          <p id="instruction">Quelle heure est-il sur l'horloge ?</p>
          
          <div id="help-box" class="hidden">
            💡 <strong>Indice :</strong> <span id="help-text">Regarde bien les aiguilles !</span>
          </div>

          <div id="choices-container">
            <button class="choice-btn" data-index="0">--</button>
            <button class="choice-btn" data-index="1">--</button>
            <button class="choice-btn" data-index="2">--</button>
          </div>

          <button id="check-btn" class="hidden">✨ Vérifier !</button>
        </div>
      </div>

      <!-- Modale Boutique -->
      <div id="shop-modal" class="modal hidden">
        <div class="modal-content">
          <h2>🛍️ La Boutique</h2>
          <p>Personnalise ton jeu avec tes engrenages !</p>
          <div id="shop-tabs">
            <button class="shop-tab active" data-tab="themes">🎨 Cadrans</button>
            <button class="shop-tab" data-tab="hands">✨ Aiguilles</button>
          </div>
          <div id="shop-items-container"></div>
          <button id="close-shop-btn">Fermer</button>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

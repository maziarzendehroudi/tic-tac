<!doctype html>
<html lang="fr" class="theme-day">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tic-Tac - Apprendre à lire l'heure</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#38bdf8">
  </head>
  <body class="theme-day">
    <div id="sky-backdrop" aria-hidden="true">
      <div class="sun-orb"></div>
      <div class="cloud cloud-1"></div>
      <div class="moon-orb"></div>
      <div class="stars-layer"></div>
    </div>

    <div id="app">
      <!-- VUE 1 : MENU PRINCIPAL -->
      <div id="main-menu" class="view">
        <div id="global-top-bar">
          <button id="dev-unlock-btn" type="button" title="Bouton provisoire de test">🔓 Mode Test</button>
          <button id="sound-toggle-btn" type="button" aria-pressed="true" aria-label="Activer ou couper le son" title="Son">🔊</button>
        </div>

        <div id="main-title-box">
          <h1>Tic-Tac</h1>
          <p>Apprends à lire l'heure pas à pas !</p>
          <div id="player-progress-bar">
            <span id="player-rank-title">⏱️ Apprenti du Temps</span>
            <span id="player-stars-count">⭐ 0 / 18</span>
          </div>
        </div>

        <div id="levels-grid">
          <button class="level-rect lvl-1" data-level="1">
            <span class="lvl-badge">1</span>
            <div class="lvl-content">
              <span class="lvl-title">Les Heures Piles</span>
            </div>
            <span class="lvl-status play">▶</span>
          </button>

          <button class="level-rect lvl-2 locked" data-level="2">
            <span class="lvl-badge">2</span>
            <div class="lvl-content">
              <span class="lvl-title">Les Demi-Heures</span>
            </div>
            <span class="lvl-status locked-icon">🔒</span>
          </button>

          <button class="level-rect lvl-3 locked" data-level="3">
            <span class="lvl-badge">3</span>
            <div class="lvl-content">
              <span class="lvl-title">Les Quarts d'Heure</span>
            </div>
            <span class="lvl-status locked-icon">🔒</span>
          </button>

          <button class="level-rect lvl-4 locked" data-level="4">
            <span class="lvl-badge">4</span>
            <div class="lvl-content">
              <span class="lvl-title">Les Minutes de 5 en 5</span>
            </div>
            <span class="lvl-status locked-icon">🔒</span>
          </button>

          <button class="level-rect lvl-5 locked" data-level="5">
            <span class="lvl-badge">5</span>
            <div class="lvl-content">
              <span class="lvl-title">Les 24 Heures</span>
            </div>
            <span class="lvl-status locked-icon">🔒</span>
          </button>

          <button class="level-rect lvl-6 locked" data-level="6">
            <span class="lvl-badge">6</span>
            <div class="lvl-content">
              <span class="lvl-title">Maître du Temps</span>
            </div>
            <span class="lvl-status locked-icon">🔒</span>
          </button>
        </div>
      </div>

      <!-- VUE 2 : ÉCRAN DE JEU -->
      <div id="game-screen" class="view hidden">
        <div id="game-top-bar">
          <button id="back-menu-btn" type="button" title="Retour au menu">
            <span class="back-label">← Menu · <span id="level-title-display">Niveau 1</span></span>
            <span id="phase-badge" class="stars-group"></span>
          </button>
        </div>

        <div id="game-container">
          <canvas id="clockCanvas" width="500" height="500"></canvas>
        </div>

        <div id="ui-container">
          <!-- 1. QUESTION FIXE -->
          <div id="instruction">Quelle heure est-il ?</div>

          <!-- 2. ZONE DES BOUTONS FIXE -->
          <div id="controls-zone">
            <div id="choices-container">
              <button class="choice-btn" type="button" data-index="0">--</button>
              <button class="choice-btn" type="button" data-index="1">--</button>
              <button class="choice-btn" type="button" data-index="2">--</button>
            </div>

            <div id="placement-tools" class="hidden">
              <div class="hand-selector-group">
                <button id="select-hour-btn" type="button" class="hand-select-btn hour-mode active-hand-btn">
                  <span class="dot-indicator dot-hour"></span> Aiguille Heures
                </button>
                <button id="select-minute-btn" type="button" class="hand-select-btn minute-mode">
                  <span class="dot-indicator dot-minute"></span> Aiguille Minutes
                </button>
              </div>
              <div class="verify-row">
                <button id="step-minus-btn" type="button" class="nudge-btn" aria-label="Reculer l'aiguille">−</button>
                <button id="check-btn" type="button">✓ Vérifier</button>
                <button id="step-plus-btn" type="button" class="nudge-btn" aria-label="Avancer l'aiguille">+</button>
              </div>
            </div>
          </div>

          <!-- 3. COMMENTAIRES TOUJOURS EN DESSOUS -->
          <div id="help-box" class="invisible-feedback">
            <span id="help-text"></span>
          </div>
        </div>
      </div>

      <!-- POPUP PWA -->
      <div id="pwa-install-modal" class="modal hidden">
        <div class="modal-content install-modal-content">
          <div class="install-icon"><img src="./favicon.svg" alt="Tic-Tac" class="install-app-icon" /></div>
          <h2>Installe Tic-Tac !</h2>
          <p id="install-text">Installe l'application sur ton écran pour y jouer sans internet !</p>
          <div class="install-actions">
            <button id="pwa-install-btn" style="padding: 12px 20px;">Installer</button>
            <button id="pwa-close-btn" style="background-color: #cbd5e1; color: #334155;">Plus tard</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

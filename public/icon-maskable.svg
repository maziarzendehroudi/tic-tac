<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    
    <linearGradient id="dayGrad" x1="0%" y1="0%" x2="65%" y2="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="nightGrad" x1="35%" y1="35%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.35" />
    </filter>
  </defs>
  <g >
    <!-- Fond épuré Jour / Nuit -->
    <rect x="0" y="0" width="512" height="512" fill="url(#dayGrad)" />
    <polygon points="512,48 512,512 48,512" fill="url(#nightGrad)" />

    <!-- Soleil & Croissant de Lune minimalistes -->
    <circle cx="96" cy="96" r="40" fill="#fde047" />
    <path d="M 436 378 A 36 36 0 1 1 384 430 A 28 28 0 1 0 436 378 Z" fill="#fef08a" />

    <!-- Cadran blanc épuré -->
    <circle cx="256" cy="256" r="174" fill="#ffffff" stroke="#0284c7" stroke-width="14.7" filter="url(#shadow)" />

    <!-- 12 index épurés (4 cardinaux marqués + 8 bâtons sobres) -->
    <line x1="256" y1="98.5" x2="256" y2="122.3" stroke="#0f172a" stroke-width="9.2" stroke-linecap="round" transform="rotate(0 256 256)" />
    <line x1="256" y1="98.5" x2="256" y2="111.3" stroke="#94a3b8" stroke-width="5.5" stroke-linecap="round" transform="rotate(30 256 256)" />
    <line x1="256" y1="98.5" x2="256" y2="111.3" stroke="#94a3b8" stroke-width="5.5" stroke-linecap="round" transform="rotate(60 256 256)" />
    <line x1="256" y1="98.5" x2="256" y2="122.3" stroke="#0f172a" stroke-width="9.2" stroke-linecap="round" transform="rotate(90 256 256)" />
    <line x1="256" y1="98.5" x2="256" y2="111.3" stroke="#94a3b8" stroke-width="5.5" stroke-linecap="round" transform="rotate(120 256 256)" />
    <line x1="256" y1="98.5" x2="256" y2="111.3" stroke="#94a3b8" stroke-width="5.5" stroke-linecap="round" transform="rotate(150 256 256)" />
    <line x1="256" y1="98.5" x2="256" y2="122.3" stroke="#0f172a" stroke-width="9.2" stroke-linecap="round" transform="rotate(180 256 256)" />
    <line x1="256" y1="98.5" x2="256" y2="111.3" stroke="#94a3b8" stroke-width="5.5" stroke-linecap="round" transform="rotate(210 256 256)" />
    <line x1="256" y1="98.5" x2="256" y2="111.3" stroke="#94a3b8" stroke-width="5.5" stroke-linecap="round" transform="rotate(240 256 256)" />
    <line x1="256" y1="98.5" x2="256" y2="122.3" stroke="#0f172a" stroke-width="9.2" stroke-linecap="round" transform="rotate(270 256 256)" />
    <line x1="256" y1="98.5" x2="256" y2="111.3" stroke="#94a3b8" stroke-width="5.5" stroke-linecap="round" transform="rotate(300 256 256)" />
    <line x1="256" y1="98.5" x2="256" y2="111.3" stroke="#94a3b8" stroke-width="5.5" stroke-linecap="round" transform="rotate(330 256 256)" />

    <!-- Petite aiguille orange (Heures -> 10h) -->
    <g transform="translate(256, 256) rotate(-60)">
      <line x1="0" y1="14.7" x2="0" y2="-78.8" stroke="#ea580c" stroke-width="18.3" stroke-linecap="round" />
    </g>

    <!-- Grande aiguille bleue (Minutes -> 10 min) -->
    <g transform="translate(256, 256) rotate(60)">
      <line x1="0" y1="18.3" x2="0" y2="-120.9" stroke="#0284c7" stroke-width="12.8" stroke-linecap="round" />
    </g>

    <!-- Pivot central -->
    <circle cx="256" cy="256" r="12.8" fill="#0f172a" stroke="#ffffff" stroke-width="4.6" />
  </g>
</svg>

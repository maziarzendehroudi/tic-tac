<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Fond arrondi bleu ciel -->
  <rect width="512" height="512" rx="115" fill="url(#sky)" />

  <!-- Ondes sonores "Tic-Tac" -->
  <path d="M 56 112 A 68 68 0 0 1 102 58" fill="none" stroke="#fef08a" stroke-width="14" stroke-linecap="round" />
  <path d="M 456 112 A 68 68 0 0 0 410 58" fill="none" stroke="#fef08a" stroke-width="14" stroke-linecap="round" />

  <!-- Cloches dorées et marteau supérieur -->
  <circle cx="128" cy="126" r="54" fill="url(#gold)" stroke="#0f172a" stroke-width="16" />
  <circle cx="384" cy="126" r="54" fill="url(#gold)" stroke="#0f172a" stroke-width="16" />
  <rect x="234" y="64" width="44" height="36" rx="16" fill="url(#gold)" stroke="#0f172a" stroke-width="14" />

  <!-- Petits pieds du réveil -->
  <circle cx="146" cy="422" r="30" fill="#f59e0b" stroke="#0f172a" stroke-width="16" />
  <circle cx="366" cy="422" r="30" fill="#f59e0b" stroke="#0f172a" stroke-width="16" />

  <!-- Boîtier et cadran blanc épuré -->
  <circle cx="256" cy="276" r="172" fill="#ffffff" stroke="#0f172a" stroke-width="18" />
  <circle cx="256" cy="276" r="146" fill="none" stroke="#e0f2fe" stroke-width="14" />

  <!-- 4 gros points repères (12h, 3h, 6h, 9h) -->
  <circle cx="256" cy="148" r="13" fill="#0284c7" />
  <circle cx="384" cy="276" r="13" fill="#f97316" />
  <circle cx="256" cy="404" r="11" fill="#94a3b8" />
  <circle cx="128" cy="276" r="11" fill="#94a3b8" />

  <!-- Pommettes roses et sourire malicieux -->
  <circle cx="182" cy="318" r="16" fill="#fda4af" />
  <circle cx="330" cy="318" r="16" fill="#fda4af" />
  <path d="M 222 324 Q 256 356 290 324" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />

  <!-- Grande aiguille bleue (12h) et Petite aiguille orange (3h) -->
  <line x1="256" y1="276" x2="256" y2="180" stroke="#0284c7" stroke-width="26" stroke-linecap="round" />
  <line x1="256" y1="276" x2="340" y2="276" stroke="#f97316" stroke-width="28" stroke-linecap="round" />

  <!-- Bouton central doré -->
  <circle cx="256" cy="276" r="22" fill="url(#gold)" stroke="#0f172a" stroke-width="12" />
</svg>
